# develop: イメージをビルドして ghcr.io に push (deploy はしない)
# main   : リリース。ビルド → ghcr.io に push → 自作デプロイ環境 (launchs) に反映
# PR     : ビルドのみ (push しない)
#
# 使う前に:
#   1. Settings > Secrets and variables > Actions に登録
#        LAUNCHS_URL    https://www.launchs.org
#        LAUNCHS_TOKEN  launchs の「自動デプロイ(webhook)」で発行したトークン
#   2. 最初の実行のあと、ghcr.io のパッケージ launchs-7207b262-269e-4265-b4f8-c2d430c28ba8 (web) と
#      sikaku-updater (updater) を Public にする
#      (launchs は非公開イメージを取得できない)
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      updater_image: ${{ steps.image.outputs.updater }}
    steps:
      - uses: actions/checkout@v4

      - name: イメージの名前を決める
        id: image
        # ghcr.io は小文字のみ
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/launchs-7207b262-269e-4265-b4f8-c2d430c28ba8" >> "$GITHUB_OUTPUT"
          echo "updater=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sikaku-updater" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- web (配信用) ----
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # ---- updater (定期更新用) ----
      - id: meta_updater
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.updater }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: updater
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_updater.outputs.tags }}
          labels: ${{ steps.meta_updater.outputs.labels }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,scope=updater,mode=max

  deploy:
    # main (リリース) のみ
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: launchs に反映
        env:
          LAUNCHS_URL: ${{ secrets.LAUNCHS_URL }}
          LAUNCHS_TOKEN: ${{ secrets.LAUNCHS_TOKEN }}
          IMAGE_REF: ${{ needs.build.outputs.image }}:${{ github.sha }}
        run: |
          # 401: トークン、403: アクセス制限、409: 反映中
          status=$(curl -sS --max-time 30 -o response.txt -w "%{http_code}" -X POST "$LAUNCHS_URL/hooks/deploy" \
            -H "X-Launchs-Token: $LAUNCHS_TOKEN" \
            -d "{\"imageRef\":\"$IMAGE_REF\"}")
          echo "HTTP $status"
          cat response.txt
          echo
          case "$status" in 2*) ;; *) exit 1 ;; esac
